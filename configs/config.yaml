paths:
  raw_data: data/raw/diabetic_data.csv
  id_mapping: data/raw/IDS_mapping.csv
  quality_report: artifacts/data_quality.json
  cleaned_data: artifacts/clean.parquet
dataset:
  download_url: https://archive.ics.uci.edu/static/public/296/diabetes+130-us+hospitals+for+years+1999-2008.zip
  terminal_discharge_ids: [11, 13, 14, 19, 20, 21]
  target_column: readmit_30
models:
  seed: 42
  n_jobs: 4
  early_stopping_rounds: 50
  tuning:
    timeout_seconds:
      normal: 180
      fast: 60
    trials:
      normal:
        random_forest: 15
        boosted: 25
      fast: 6
    logistic_c:
      - 0.01
      - 0.1
      - 1.0
      - 10.0
    pruner:
      startup_trials: 5
      warmup_folds: 1
  search:
    random_forest:
      n_estimators: [200, 600]
      max_depth: [8, 30]
      min_samples_leaf: [1, 20]
      max_features: [sqrt, log2, 0.5]
    xgboost:
      n_estimators: [200, 1200]
      max_depth: [3, 9]
      learning_rate: [0.01, 0.2]
      min_child_weight: [1, 10]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]
      reg_lambda: [0.1, 10.0]
    lightgbm:
      n_estimators: [200, 1200]
      num_leaves: [15, 63]
      max_depth: [4, 12]
      learning_rate: [0.01, 0.2]
      min_child_samples: [10, 80]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]
      reg_lambda: [0.1, 10.0]
    catboost:
      iterations: [200, 1200]
      depth: [4, 10]
      learning_rate: [0.01, 0.2]
      l2_leaf_reg: [1.0, 10.0]
      random_strength: [0.0, 2.0]
evaluation:
  recall_target: 0.60
  false_negative_cost: 5
  false_positive_cost: 1
  high_risk_percentile: 90
  calibration_folds: 5
explain:
  sample_size: 3000
  seed: 42
